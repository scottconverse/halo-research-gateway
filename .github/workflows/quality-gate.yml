name: quality-gate
on:
  push:
    # Docs-only changes start no CI run (docs get push, merge and publish only).
    paths: ['**', '!**.md', '!**.mdx', '!**.rst', '!**.docx', '!**.pdf', '!**/LICENSE', '!**/LICENSE.*', '!**/NOTICE', '!**/NOTICE.*', '!docs/**.png', '!docs/**.jpg', '!docs/**.svg', '!docs/**.gif', '!docs/**.webp', '!docs/**.html', '!docs/**.css', '**/SKILL.md', '**/skills/**', '**/agents/**', '**/commands/**', '**/prompts/**', '**/references/**', '.claude/**']
  pull_request:
    # Docs-only changes start no CI run (docs get push, merge and publish only).
    paths: ['**', '!**.md', '!**.mdx', '!**.rst', '!**.docx', '!**.pdf', '!**/LICENSE', '!**/LICENSE.*', '!**/NOTICE', '!**/NOTICE.*', '!docs/**.png', '!docs/**.jpg', '!docs/**.svg', '!docs/**.gif', '!docs/**.webp', '!docs/**.html', '!docs/**.css', '**/SKILL.md', '**/skills/**', '**/agents/**', '**/commands/**', '**/prompts/**', '**/references/**', '.claude/**']
jobs:
  gate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.3'
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: uv python install 3.12
      - run: uv sync --locked --extra crawl --extra documents --group dev
      - shell: pwsh
        run: ./scripts/Invoke-QualityGate.ps1 -Scope CI
      - working-directory: website
        run: npm ci
      - working-directory: website
        run: npm run lint
      - working-directory: website
        run: npm run build
