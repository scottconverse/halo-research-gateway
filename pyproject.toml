[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "halo-research-gateway"
version = "0.1.0"
description = ""
requires-python = ">=3.12,<3.13"
dependencies = [
    "mcp[cli]",
    "httpx[http2]",
    "aiosqlite",
    "defusedxml",
    "platformdirs",
    "tldextract",
    "pydantic-settings",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "respx",
    "ruff",
]

[project.urls]
Homepage = ""
Repository = ""

[tool.hatch.build.targets.sdist]
packages = ["src/halo_research_gateway"]
