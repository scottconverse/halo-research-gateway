[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "halo-research-gateway"
version = "0.3.0"
description = "Windows-native, agent-neutral MCP research gateway for evidence-backed web and connected-source research."
requires-python = ">=3.12,<3.13"
dependencies = [
    "mcp[cli]",
    "httpx[http2]",
    "aiosqlite",
    "defusedxml",
    "platformdirs",
    "tldextract",
    "pydantic-settings",
    "ddgs>=9,<10",
    "selectolax>=0.3,<1",
    "cryptography>=45,<47",
]

[project.optional-dependencies]
crawl = ["crawl4ai>=0.9,<1"]
documents = ["pymupdf>=1.26,<2"]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "respx",
    "ruff",
    "mypy",
    "coverage",
]

[project.urls]
Homepage = "https://github.com/scottconverse/halo-research-gateway"
Repository = "https://github.com/scottconverse/halo-research-gateway"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.sdist]
include = [
    "/src/halo_research_gateway",
    "/README.md",
    "/CONTRIBUTING.md",
    "/CHANGELOG.md",
    "/docs/USER-MANUAL.md",
    "/docs/RELEASE-NOTES-v0.3.0.md",
    "/docs/DSH-VERIFIED-WORKFLOW-EVIDENCE-2026-09-03.md",
    "/integrations/dsh",
]
