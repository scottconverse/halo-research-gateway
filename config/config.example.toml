[server]
port = 8765
mcp_path = "/mcp"
health_path = "/health"
log_level = "INFO"

[storage]
database = "C:\\Users\\scott\\AppData\\Local\\HaloResearchGateway\\state\\gateway.db"
# Positive compressed-payload limits; not physical SQLite/WAL file-size limits.
# Gateway reads/writes prune expired/over-limit rows. Oversized results stay readable uncached.
cache_max_bytes = 1073741824
entry_max_bytes = 5242880
inline_payload_max_bytes = 262144
content_directory = "C:\\Users\\scott\\AppData\\Local\\HaloResearchGateway\\state\\content\\sha256"
backup_directory = "C:\\Users\\scott\\AppData\\Local\\HaloResearchGateway\\state\\backups"

[output]
unidentified_default_chars = 6000
unidentified_ceiling_chars = 6000
cursor_ttl_seconds = 3600
snapshot_max_entries = 128
snapshot_max_bytes = 67108864

[queues]
exa_max_pending = 20
http_max_pending = 50
reddit_max_pending = 12
crawl_max_pending = 4
default_per_client_pending = 4

[http]
global_concurrency = 4
per_origin_concurrency = 1
per_origin_interval_seconds = 1.0
connect_timeout_seconds = 10
# Also shared by each complete GitHub operation, including token setup/follow-ups.
total_timeout_seconds = 30
max_redirects = 5
max_compressed_bytes = 10485760
# Also the sum of decoded response bytes for one GitHub research/discussion call.
max_decompressed_bytes = 20971520

[reddit]
base_url = "https://www.reddit.com"
min_interval_seconds = 8.0
rate_limit_backoff_seconds = 60
max_consecutive_429 = 3
circuit_cooldown_seconds = 1800

[exa]
url = "https://mcp.exa.ai/mcp?tools=web_search_exa,web_fetch_exa"
anonymous = true
min_interval_seconds = 1.0
daily_soft_limit = 45

[crawl]
enabled = true
gate_evidence_sha256 = "development-unverified"
concurrency = 1
page_timeout_seconds = 45
job_timeout_seconds = 120
max_pages = 25
max_depth = 3
base_directory = "C:\\Users\\scott\\AppData\\Local\\HaloResearchGateway\\browser"

[imports]
approval_ttl_seconds = 300

[jobs]
max_active = 2
default_timeout_seconds = 1800
absolute_timeout_seconds = 21600
absolute_pages = 5000
lease_seconds = 30

# Optional paid providers are inert until every field below is deliberately
# configured. Credentials are stored in the encrypted connection vault; never
# put a token in this file. Implemented provider names are `capsolver` and
# `brightdata`; live enablement still requires an operator-selected account,
# exact domains, attempt ceiling, spend ceiling, and acceptance receipt.
# request_cost_usd is an operator reservation estimate, not a vendor billing cap.
# Zero or missing refuses automatic paid requests.
[captcha]
enabled = false
request_cost_usd = 0
# provider = "capsolver"
# connection_id = "operator-created-opaque-id"
# allowed_domains = ["example.com"]
# daily_attempt_limit = 2
# daily_spend_limit_usd = 1.00

[proxy]
enabled = false
request_cost_usd = 0
# provider = "brightdata"
# connection_id = "operator-created-opaque-id"
# allowed_domains = ["example.com"]
# daily_attempt_limit = 2
# daily_spend_limit_usd = 1.00

[local_targets.mission_control]
scheme = "http"
host = "127.0.0.1"
port = 3090
path_prefixes = ["/"]
methods = ["GET", "HEAD"]
browser_allowed = true
cache_authenticated = false
